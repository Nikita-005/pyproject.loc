<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
    defer></script>
    <link rel="stylesheet" href=/css/main.css>

</head>
<body style="margin: 0; padding: 0">
    <header class="header" >
        <div class="logo">
            <a href="/">Logo</a>
        </div>
        <ul class="main-ul" >
                <li><a class="nav-a" href="/">Главная</a></li>
                <li><a class="nav-a" href="/about">О нас</a></li>
                <li><a class="nav-a" href="/articles">Статьи</a></li>
                <li>
                    {% if user %}
                        <p>{{user.get_nickname()}} <a class="nav-a" href="/user/logout">Выход</a></p>
                    {% else %}
                       <p><a class="nav-a" href="/user/login">Войти</a></p>
                    {% endif %}
                </li>
        </ul>
    </header>

    <main>
        {% include content %}
    </main>

    <footer style="background-color: burlywood; padding: 1vw;">
        <p style="display:flex; justify-content: center">Все права защищены 2026г.</p>
    </footer>

<script src="js/script.js"></script>
</body>
</html>
